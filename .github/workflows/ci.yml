name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }} / tailwind ${{ matrix.tailwind }}
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: test
      TAILWIND_VERSION: ${{ matrix.tailwind }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18'
            otp: '27'
            tailwind: '4.2.2'
          - elixir: '1.20'
            otp: '29'
            lint: true
            tailwind: '4.2.2'
          - elixir: '1.20'
            otp: '29'
            tailwind: '4.3.1'

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-tw${{ matrix.tailwind }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-tw${{ matrix.tailwind }}

      - run: mix deps.get

      - run: mix deps.unlock --check-unused
        if: ${{ matrix.lint }}

      - run: mix hex.audit
        if: ${{ matrix.lint }}

      - run: mix deps.compile

      - run: mix format --check-formatted
        if: ${{ matrix.lint }}

      - run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}

      - run: mix compile
        if: ${{ !matrix.lint }}

      - run: mix credo --format oneline
        if: ${{ matrix.lint }}

      - run: mix test --cover
